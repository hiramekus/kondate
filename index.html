<!DOCTYPE html>
<html lang="ja">

<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark" aria-label="Offcanvas navbar large">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">KONDATE</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar2"
                aria-controls="offcanvasNavbar2" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="offcanvasNavbar2"
                aria-labelledby="offcanvasNavbar2Label">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasNavbar2Label">MENU</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                        aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">献立一覧</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">平日の夕食</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="recipe-add.html">献立を追加</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <main class="py-3">

            <h1 class="fs-2 fw-bold mb-4">献立一覧</h1>

            <ul class="nav nav-tabs" id="myTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="home-tab" data-bs-toggle="tab" data-bs-target="#main"
                        type="button" role="tab" aria-controls="main" aria-selected="true">メイン</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="profile-tab" data-bs-toggle="tab" data-bs-target="#sub" type="button"
                        role="tab" aria-controls="sub" aria-selected="false">サブ</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="messages-tab" data-bs-toggle="tab" data-bs-target="#soup" type="button"
                        role="tab" aria-controls="soup" aria-selected="false">スープ</button>
                </li>
            </ul>

            <div class="tab-content mt-3">
                <div class="tab-pane active" id="main" role="tabpanel" aria-labelledby="main-tab" tabindex="0">
                    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3"></div>
                </div>
                <!-- /.tabpane -->

                <div class="tab-pane" id="sub" role="tabpanel" aria-labelledby="sub-tab" tabindex="0">
                    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3"></div>
                </div>
                <!-- /.tabpane -->

                <div class="tab-pane" id="soup" role="tabpanel" aria-labelledby="soup-tab" tabindex="0">
                    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3"></div>
                </div>
                <!-- /.tabpane -->
            </div>
            <!-- /.tab-content -->

        </main>

        <!-- ローディング -->
        <div id="loading" class="justify-content-center py-5" style="display: none;">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
        <!-- /.spinner -->

    </div>
    <!-- .container -->

     <div class="text-end">
        <div class="fixed-bottom p-3">
            <a href="recipe-add.html" class="btn btn-primary">
                <div class="d-flex align-items-center">
                    <i class="bi bi-plus fs-3"></i>
                    <span>献立を追加</span>
                </div>
            </a>
        </div>
     </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous">
    </script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function () {
            $('#loading').css('display','flex');
            $.getJSON(
                "https://script.google.com/macros/s/AKfycbz7pdsW5sFZDHvMFmyhZz9dGrjCmrHP67oeggeCotaEbiuKfCfDa17aYy_QgfBg27kgng/exec"
            )
            .done(function (data) {
                const sections = { main: "", sub: "", soup: "" };

                data.forEach(function (item) {
                    console.log(item.レシピのURLかレシピを手入力してください);

                    let recipeContent;
                    if (item.レシピのURLかレシピを手入力してください && item.レシピのURLかレシピを手入力してください.startsWith("http")) {
                        recipeContent = `<a href="${item.レシピ}" target="_blank">レシピを見る</a>`;
                    } else {
                        recipeContent = item.レシピのURLかレシピを手入力してください;
                    }
                    const html = `
                        <div class="col mb-3">
                            <div class="card h-100">
                                <div class="card-body">
                                    <h5 class="card-title fw-bold">
                                        ${item.献立名を入力してください}
                                    </h5>
                                    <p class="card-text">
                                        ${recipeContent}
                                    </p>
                                </div>
                            </div>
                        </div>
                    `;

                    if (item.献立のカテゴリを選択してください === "メイン") {
                        sections.main += html;
                    } else if (item.献立のカテゴリを選択してください === "サブ") {
                        sections.sub += html;
                    } else if (item.献立のカテゴリを選択してください === "スープ") {
                        sections.soup += html;
                    }
                });

                $("#main .row").html(sections.main);
                $("#sub .row").html(sections.sub);
                $("#soup .row").html(sections.soup);
            })
            .fail(function () {
                console.error("読み込みエラー");
            })
            .always(function () {
                // 読み込み完了時にスピナーを非表示
                $('#loading').hide();
            });
        });
    </script>
</body>

</html>
