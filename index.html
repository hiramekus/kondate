<!DOCTYPE html>
<html lang="ja">

<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://kit.fontawesome.com/f8b339594b.js" crossorigin="anonymous"></script>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark" aria-label="Offcanvas navbar large">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">KONDATE</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar2"
                aria-controls="offcanvasNavbar2" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="offcanvasNavbar2"
                aria-labelledby="offcanvasNavbar2Label">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasNavbar2Label">MENU</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                        aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">献立一覧</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="plan.html">週間予定</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="recipe-add.html">献立を追加</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <main class="py-3">
            <div class="d-flex flex-wrap justify-content-between gap-3 align-items-center mb-4">
                <h1 class="fw-bold mb-0 fs-2">献立一覧</h1>
                <div class="ms-auto">
                    <button id="btn-selected-recipes" type="button" class="btn btn-primary js-selected-recipes-button"
                        data-bs-toggle="modal" data-bs-target="#modal-selected-recipes" disabled>
                        <i class="fa-solid fa-utensils me-1"></i>
                        <span>作るリストを見る</span>
                    </button>
                    <button id="btn-clear-all-selections" type="button"
                        class="btn btn-outline-danger">
                        <span>全選択解除</span>
                    </button>
                </div>
            </div>

            <ul class="nav nav-tabs fw-bold" id="myTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active js-tab-button" id="home-tab" data-bs-toggle="tab"
                        data-bs-target="#main" type="button" role="tab" aria-controls="main"
                        aria-selected="true">メイン</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link js-tab-button" id="profile-tab" data-bs-toggle="tab" data-bs-target="#sub"
                        type="button" role="tab" aria-controls="sub" aria-selected="false">サブ</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link js-tab-button" id="messages-tab" data-bs-toggle="tab" data-bs-target="#soup"
                        type="button" role="tab" aria-controls="soup" aria-selected="false">スープ</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link js-tab-button" id="messages-tab" data-bs-toggle="tab"
                        data-bs-target="#staple" type="button" role="tab" aria-controls="staple"
                        aria-selected="false">主食のみ</button>
                </li>
            </ul>

            <!-- 栄養素フィルター -->
            <div class="py-3">
                <div class="nutrition-filter-grid">
                    <span id="filter-status" class="filter-status text-muted small"></span>
                    <div id="nutrition-filters" class="d-flex flex-wrap gap-2">
                        <!-- 動的に生成されるフィルター -->
                    </div>
                    <a href="#" id="btn-clear-filters" class="small text-decoration-none" style="display: none;">クリア</a>
                </div>
            </div>

            <div id="recipe-list" class="js-recipe-list tab-content mt-2">
                <div class="tab-pane active js-tab-main" id="main" role="tabpanel" aria-labelledby="main-tab"
                    tabindex="0">
                    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3"></div>
                </div>
                <!-- /.tabpane -->

                <div class="tab-pane js-tab-sub" id="sub" role="tabpanel" aria-labelledby="sub-tab" tabindex="0">
                    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3"></div>
                </div>
                <!-- /.tabpane -->

                <div class="tab-pane js-tab-soup" id="soup" role="tabpanel" aria-labelledby="soup-tab" tabindex="0">
                    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3"></div>
                </div>
                <!-- /.tabpane -->
                <div class="tab-pane js-tab-staple" id="staple" role="tabpanel" aria-labelledby="staple-tab"
                    tabindex="0">
                    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3"></div>
                </div>
                <!-- /.tabpane -->
            </div>
            <!-- /.tab-content -->

        </main>

        <!-- 固定スロットマシンボタン -->
        <div class="fixed-slot-button">
            <button id="btn-slot-machine" type="button" class="btn btn-warning btn-lg js-slot-button">
                <i class="fa-solid fa-shuffle"></i>
            </button>
        </div>

        <!-- ローディング -->
        <div id="loading" class="justify-content-center py-5" style="display: none;">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
        <!-- /.spinner -->

    </div>
    <!-- .container -->

    <!-- Modal -->
    <div class="modal fade" id="modal-selected-recipes" tabindex="-1" aria-labelledby="staticBackdropLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="staticBackdropLabel">作るリスト</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <ul id="selected-recipes" class="mb-0 js-selected-recipes-list"></ul>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">閉じる</button>
                    <a id="btn-line-share" target="_blank" class="btn btn-primary js-line-share-button">
                        <i class="fa-solid fa-paper-plane me-1"></i>
                        <span>LINEで送る</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- スロットマシン -->
    <div id="slot-machine-overlay" class="slot-overlay" style="display: none;">
        <div class="slot-machine">
            <div class="slot-header">KONDATE SLOT</div>

            <div class="slot-row">
                <div class="slot-icon"><img src="https://placehold.jp/50x50.png" alt="メイン"></div>
                <div class="slot-window js-slot-window" data-category="main">メイン料理</div>
                <button class="stop-button js-stop-button" data-category="main"><div class="glare"></div></button>
            </div>

            <div class="slot-row">
                <div class="slot-icon"><img src="https://placehold.jp/50x50.png" alt="サブ"></div>
                <div class="slot-window js-slot-window" data-category="sub">サブ料理</div>
                <button class="stop-button js-stop-button" data-category="sub"></button>
            </div>

            <div class="slot-row">
                <div class="slot-icon"><img src="https://placehold.jp/50x50.png" alt="スープ"></div>
                <div class="slot-window js-slot-window" data-category="soup">スープ</div>
                <button class="stop-button js-stop-button" data-category="soup"></button>
            </div>

            <div class="slot-row">
                <div class="slot-icon"><img src="https://placehold.jp/50x50.png" alt="主食"></div>
                <div class="slot-window js-slot-window" data-category="staple">主食</div>
                <button class="stop-button js-stop-button" data-category="staple"></button>
            </div>

            <div class="slot-lever-container">
                <div class="slot-lever-group" id="reset-btn">
                    <div class="slot-lever-handle"></div>
                    <div class="slot-lever-shaft"></div>
                </div>
            </div>

            <button type="button" class="slot-close-btn" id="slot-close-btn">
                <i class="fa-solid fa-times"></i>
            </button>

            <div class="slot-footer">
                <button type="button" class="add-to-list-btn js-add-slot-to-list-btn" id="btn-add-slot-to-list" disabled>
                    <i class="bi bi-plus-circle me-1"></i>作るリストに追加
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous">
        </script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        $(function () {
            let allRecipes = []; // 全レシピデータを保存
            let availableNutritions = []; // 利用可能な栄養素リスト

            //
            // レシピの表示
            //
            $('#loading').css('display', 'flex');
            $.getJSON(
                "https://script.google.com/macros/s/AKfycbz7pdsW5sFZDHvMFmyhZz9dGrjCmrHP67oeggeCotaEbiuKfCfDa17aYy_QgfBg27kgng/exec"
            )
                .done(function (data) {
                    allRecipes = data; // データを保存
                    generateNutritionFilters(data); // フィルターを生成
                    displayRecipes(data); // 初期表示
                    prepareSlotData(data); // スロットデータを準備
                })
                .fail(function (jqXHR, textStatus, errorThrown) {
                    console.error("読み込みエラー:", textStatus, errorThrown);
                })
                .always(function () {
                    // 読み込み完了時にスピナーを非表示
                    $('#loading').hide();
                });

            // レシピを表示する関数
            function displayRecipes(data) {
                const sections = { main: "", sub: "", soup: "", staple: "" };

                data.forEach(function (item) {
                    let recipeContent;
                    if (item.レシピのURLかレシピを手入力してください && item.レシピのURLかレシピを手入力してください.startsWith("http")) {
                        recipeContent = `<a href="${item.レシピのURLかレシピを手入力してください}" target="_blank">レシピを見る</a>`;
                    } else {
                        recipeContent = item.レシピのURLかレシピを手入力してください;
                    }

                    // 栄養素情報を表示用に整形
                    let nutritionInfo = '';
                    if (item.栄養のカテゴリを選択してください && item.栄養のカテゴリを選択してください.length > 0) {
                        nutritionInfo = `<span class="badge rounded-pill js-nutrition-badge" data-nutrition="${item.nutrition}">${item.栄養のカテゴリを選択してください}</span>`;
                    }

                    const html = `
                        <div class="col mb-3 js-recipe-item" data-nutrition="${item.nutrition || ''}">
                            <label class="card h-100" for="${item.タイムスタンプ}">
                                <div class="card-body">
                                    <div class="d-flex flex-column justify-content-between h-100 gap-2">
                                        <div class="recipe-content">
                                            <div class="form-check fw-bold mb-1">
                                                <input class="form-check-input js-recipe-checkbox" type="checkbox" value="${item.献立名を入力してください}" id="${item.タイムスタンプ}">
                                                <span class="form-check-label">
                                                    ${item.献立名を入力してください}
                                                </span>
                                            </div>
                                            <p class="card-text">
                                                ${recipeContent}
                                            </p>
                                        </div>
                                        <div class="recipe-nutrition js-recipe-nutrition">
                                            ${nutritionInfo}
                                        </div>
                                    </div>
                                </div>
                            </label>
                        </div>
                    `;

                    if (item.献立のカテゴリを選択してください === "メイン") {
                        sections.main += html;
                    } else if (item.献立のカテゴリを選択してください === "サブ") {
                        sections.sub += html;
                    } else if (item.献立のカテゴリを選択してください === "スープ") {
                        sections.soup += html;
                    } else if (item.献立のカテゴリを選択してください === "主食のみ") {
                        sections.staple += html;
                    }
                });

                $("#main .row").html(sections.main);
                $("#sub .row").html(sections.sub);
                $("#soup .row").html(sections.soup);
                $("#staple .row").html(sections.staple);

                // 初期表示時にレシピ数を表示
                updateRecipeCount();
            }

            // 栄養素フィルターを動的に生成（バッジ形式）
            function generateNutritionFilters(data) {
                const nutritionSet = new Set();

                // データから栄養素を抽出
                data.forEach(function (item) {
                    if (item.nutrition && item.nutrition.trim() !== '') {
                        nutritionSet.add(item.nutrition.trim());
                    }
                });

                availableNutritions = Array.from(nutritionSet).sort();

                // フィルターHTMLを生成
                let filtersHtml = '';
                availableNutritions.forEach(function (nutrition, index) {
                    // 対応する日本語名を探す
                    let displayName = nutrition;
                    data.some(function(item) {
                        if (item.nutrition === nutrition) {
                            displayName = item.栄養のカテゴリを選択してください;
                            return true;
                        }
                        return false;
                    });
                    
                    filtersHtml += `
                        <span class="badge nutrition-filter-badge js-nutrition-filter" data-nutrition="${nutrition}">
                            ${displayName}
                        </span>
                    `;
                });

                $('#nutrition-filters').html(filtersHtml);

                // バッジクリックイベント
                $('.js-nutrition-filter').on('click', function () {
                    if ($(this).hasClass('active')) {
                        $(this).removeClass('active');
                    } else {
                        $(this).addClass('active');
                    }
                    applyNutritionFilter();
                });
            }

            // 栄養素フィルター機能
            function applyNutritionFilter() {
                const selectedNutritions = [];
                $('.js-nutrition-filter.active').each(function () {
                    selectedNutritions.push($(this).data('nutrition'));
                });

                // クリアボタンの表示/非表示を制御
                if (selectedNutritions.length > 0) {
                    $('#btn-clear-filters').show();
                } else {
                    $('#btn-clear-filters').hide();
                }

                updateRecipeCount();
            }

            // アクティブなタブのレシピ数を更新
            function updateRecipeCount() {
                const selectedNutritions = [];
                $('.js-nutrition-filter.active').each(function () {
                    selectedNutritions.push($(this).data('nutrition'));
                });

                // アクティブなタブを取得
                const activeTab = $('.tab-pane.active');
                let visibleCount = 0;

                if (selectedNutritions.length === 0) {
                    // フィルターが選択されていない場合は全て表示
                    $('.js-recipe-item').each(function () {
                        $(this).show();
                    });
                    // アクティブなタブのレシピ数をカウント
                    activeTab.find('.js-recipe-item').each(function () {
                        visibleCount++;
                    });
                } else {
                    // フィルターを適用
                    $('.js-recipe-item').each(function () {
                        const recipeNutrition = $(this).data('nutrition');
                        if (recipeNutrition) {
                            const hasMatchingNutrition = selectedNutritions.includes(recipeNutrition.toString());
                            if (hasMatchingNutrition) {
                                $(this).show();
                                // アクティブなタブのアイテムのみカウント
                                if (activeTab.find(this).length > 0) {
                                    visibleCount++;
                                }
                            } else {
                                $(this).hide();
                            }
                        } else {
                            // 栄養データがない場合は非表示
                            $(this).hide();
                        }
                    });
                }

                $('#filter-status').text(`${visibleCount}レシピ`);
            }

            // フィルタークリアボタン
            $('#btn-clear-filters').on('click', function () {
                $('.js-nutrition-filter').removeClass('active');
                applyNutritionFilter();
            });

            // タブ切り替え時にレシピ数を更新
            $('.js-tab-button').on('shown.bs.tab', function () {
                updateRecipeCount();
            });

            //
            // 選択済の献立を表示する
            //
            $(document).on("change", ".js-recipe-checkbox", function () {
                const $changedCheckbox = $(this);
                const recipe = $changedCheckbox.val();
                const changedCheckboxId = $changedCheckbox.attr("id");
                const $list = $(".js-selected-recipes-list");

                if ($changedCheckbox.is(":checked")) {
                    $list.append(`<li id="selected-${changedCheckboxId}">${recipe}</li>`);
                } else {
                    $(`[id="selected-${changedCheckboxId}"]`).remove();
                }

                // 選択済の献立があれば「選択済を見る」ボタンを有効化する
                if ($("#recipe-list .js-recipe-checkbox:checked").length >= 1) {
                    $(".js-selected-recipes-button").prop("disabled", false);
                } else {
                    $(".js-selected-recipes-button").prop("disabled", true);
                }
            });

            // ライン送信用のテキストの準備
            $(".js-selected-recipes-button").on("click", function () {
                const recipes = $(".js-selected-recipes-list li").map(function () {
                    return $(this).text();
                }).get();

                // 改行で結合し、エンコード
                const message = "【献立】\n" + recipes.join("\n");
                const encodedMessage = encodeURIComponent(message);

                // LINEのリンクにセット
                $(".js-line-share-button").attr("href", `https://line.me/R/msg/text/?${encodedMessage}`);
            });

            //
            // 献立スロット
            //
            let mainList = [], subList = [], soupList = [], stapleList = [];
            let slotIntervals = {}; // 各スロットの回転状態を管理
            let lastSlotResults = []; // 前回のスロット結果を保存

            // スロット用データの準備
            function prepareSlotData(data) {
                data.forEach(item => {
                    switch (item.献立のカテゴリを選択してください) {
                        case "メイン":
                            mainList.push(item.献立名を入力してください);
                            break;
                        case "サブ":
                            subList.push(item.献立名を入力してください);
                            break;
                        case "スープ":
                            soupList.push(item.献立名を入力してください);
                            break;
                        case "主食のみ":
                            stapleList.push(item.献立名を入力してください);
                            break;
                    }
                });
            }

            // スロット自動開始関数
            function startAllSlots() {
                const categories = ['main', 'sub', 'soup', 'staple'];
                const lists = [mainList, subList, soupList, stapleList];

                categories.forEach((category, index) => {
                    const list = lists[index];
                    if (list.length > 0) {
                        const slotWindow = $(`.js-slot-window[data-category="${category}"]`);
                        const stopButton = $(`.js-stop-button[data-category="${category}"]`);

                        slotWindow.removeClass('slot-result');
                        stopButton.prop('disabled', false);

                        slotIntervals[category] = setInterval(function () {
                            const randomItem = list[Math.floor(Math.random() * list.length)];
                            slotWindow.text(randomItem);
                        }, 100);
                    }
                });
            }

            // スロットマシンボタンクリック時の処理
            $('.js-slot-button').on('click', function() {
                resetSlotsToInitialState();
                $('#slot-machine-overlay').fadeIn(300);
                startAllSlots();
            });

            // スロットマシン閉じるボタンクリック時の処理
            $('#slot-close-btn').on('click', function() {
                $('#slot-machine-overlay').fadeOut(300);
                // 全てのスロットを停止
                Object.keys(slotIntervals).forEach(category => {
                    clearInterval(slotIntervals[category]);
                    delete slotIntervals[category];
                });
            });

            // オーバーレイクリック時の処理（スロットマシン部分以外をクリックした場合）
            $('#slot-machine-overlay').on('click', function(e) {
                if (e.target === this) {
                    $('#slot-machine-overlay').fadeOut(300);
                    // 全てのスロットを停止
                    Object.keys(slotIntervals).forEach(category => {
                        clearInterval(slotIntervals[category]);
                        delete slotIntervals[category];
                    });
                }
            });

            // スロットを初期状態にリセットする関数
            function resetSlotsToInitialState() {
                // 前回のスロット結果に対応するレシピカードのチェックを外す
                if (lastSlotResults.length > 0) {
                    lastSlotResults.forEach(function (recipeName) {
                        if (recipeName && recipeName !== 'メイン料理' && recipeName !== 'サブ料理' && recipeName !== 'スープ' && recipeName !== '主食') {
                            // レシピカードのチェックを外す
                            $('input[type="checkbox"]').each(function () {
                                if ($(this).val() === recipeName) {
                                    $(this).prop('checked', false);
                                }
                            });

                            // 作るリストからも削除
                            $('.js-selected-recipes-list li').each(function () {
                                if ($(this).text() === recipeName) {
                                    $(this).remove();
                                }
                            });
                        }
                    });

                    // 作るリストボタンの状態を更新
                    if ($("#recipe-list .js-recipe-checkbox:checked").length >= 1) {
                        $(".js-selected-recipes-button").prop("disabled", false);
                    } else {
                        $(".js-selected-recipes-button").prop("disabled", true);
                    }
                }

                // 全てのスロットを停止
                Object.keys(slotIntervals).forEach(category => {
                    clearInterval(slotIntervals[category]);
                    delete slotIntervals[category];
                });

                // 初期状態に戻す
                $('.js-slot-window[data-category="main"]').text('メイン料理');
                $('.js-slot-window[data-category="sub"]').text('サブ料理');
                $('.js-slot-window[data-category="soup"]').text('スープ');
                $('.js-slot-window[data-category="staple"]').text('主食');

                $('.js-slot-window').removeClass('slot-result');
                $('.js-stop-button').prop('disabled', false);
                $('.js-add-slot-to-list-btn').prop('disabled', true);

                // 前回の結果をクリア
                lastSlotResults = [];
            }

            // モーダルが閉じたときにスロット停止
            $('#modal-slot-machine').on('hidden.bs.modal', function () {
                Object.keys(slotIntervals).forEach(category => {
                    clearInterval(slotIntervals[category]);
                    delete slotIntervals[category];
                });
                $('.js-slot-window').removeClass('slot-spinning');
            });

            // 個別スロット停止機能
            $('.js-stop-button').on('click', function () {
                const category = $(this).data('category');
                const button = $(this);
                const slotWindow = $(`.js-slot-window[data-category="${category}"]`);

                if (slotIntervals[category]) {
                    // スロット停止
                    clearInterval(slotIntervals[category]);
                    delete slotIntervals[category];
                    slotWindow.addClass('slot-result');
                    button.prop('disabled', true);

                    // 全てのスロットが停止したか確認
                    checkAllSlotsStopped();
                }
            });

            // 全スロット停止チェック関数
            function checkAllSlotsStopped() {
                const stoppedSlots = $('.js-stop-button:disabled').length;
                if (stoppedSlots >= 4) {
                    $('.js-add-slot-to-list-btn').prop('disabled', false);
                } else {
                    $('.js-add-slot-to-list-btn').prop('disabled', true);
                }
            }

            // リセットボタン
            $('#reset-btn').on('click', function () {
                const $group = $(this);
                // アニメーションクラスをリセットしてから再適用（連続クリック対応）
                $group.removeClass('active');
                void $group[0].offsetWidth;
                $group.addClass('active');
                
                // 全てのスロットを停止
                Object.keys(slotIntervals).forEach(category => {
                    clearInterval(slotIntervals[category]);
                    delete slotIntervals[category];
                });

                // 初期状態に戻す
                $('.js-slot-window[data-category="main"]').text('メイン料理');
                $('.js-slot-window[data-category="sub"]').text('サブ料理');
                $('.js-slot-window[data-category="soup"]').text('スープ');
                $('.js-slot-window[data-category="staple"]').text('主食');

                $('.js-slot-window').removeClass('slot-result');
                $('.js-stop-button').prop('disabled', false);
                $('.js-add-slot-to-list-btn').prop('disabled', true);

                // スロット再開始
                setTimeout(() => {
                    startAllSlots();
                }, 400);
            });

            // スロット結果を作るリストに追加
            $('.js-add-slot-to-list-btn').on('click', function () {
                const slotResults = [
                    $('.js-slot-window[data-category="main"]').text(),
                    $('.js-slot-window[data-category="sub"]').text(),
                    $('.js-slot-window[data-category="soup"]').text(),
                    $('.js-slot-window[data-category="staple"]').text()
                ];

                // 今回の結果を保存
                lastSlotResults = slotResults.slice();

                // スロット結果を作るリストに追加
                slotResults.forEach(function (recipeName) {
                    if (recipeName && recipeName !== 'メイン料理' && recipeName !== 'サブ料理' && recipeName !== 'スープ' && recipeName !== '主食') {
                        // 既にリストにあるかチェック
                        if ($('#selected-recipes li').filter(function () {
                            return $(this).text() === recipeName;
                        }).length === 0) {
                            // ユニークIDを生成
                            const uniqueId = 'slot-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
                            $('.js-selected-recipes-list').append(`<li id="selected-${uniqueId}">${recipeName}</li>`);

                            // レシピカードのチェックボックスをチェック
                            $('input[type="checkbox"]').each(function () {
                                if ($(this).val() === recipeName) {
                                    $(this).prop('checked', true);
                                }
                            });
                        }
                    }
                });

                // ボタン状態を更新
                if ($("#recipe-list .js-recipe-checkbox:checked").length >= 1) {
                    $(".js-selected-recipes-button").prop("disabled", false);
                }

                // スロットマシンを閉じて作るリストモーダルを開く
                $('#slot-machine-overlay').fadeOut(300);
                setTimeout(function () {
                    $('#modal-selected-recipes').modal('show');
                }, 350);
            });

            // 全選択解除機能
            $('#btn-clear-all-selections').on('click', function () {
                // 全てのチェックボックスを解除
                $('#recipe-list .js-recipe-checkbox').prop('checked', false);
                // 作るリストをクリア
                $('.js-selected-recipes-list').empty();
                // ボタンを無効化
                $('.js-selected-recipes-button').prop('disabled', true);
            });

            // データ読み込み後にスロットデータを準備
            $.getJSON(
                "https://script.google.com/macros/s/AKfycbz7pdsW5sFZDHvMFmyhZz9dGrjCmrHP67oeggeCotaEbiuKfCfDa17aYy_QgfBg27kgng/exec",
                function (data) {
                    prepareSlotData(data);
                }
            );
        });
    </script>
</body>

</html>
