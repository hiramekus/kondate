    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous">
    </script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function () {
            $.getJSON(
                "https://script.google.com/macros/s/AKfycbz7pdsW5sFZDHvMFmyhZz9dGrjCmrHP67oeggeCotaEbiuKfCfDa17aYy_QgfBg27kgng/exec"
            )
            .done(function (data) {
                const sections = { main: "", sub: "", soup: "" };

                data.forEach(function (item) {

                    let recipeContent;
                    if (item.レシピ && item.レシピ.startsWith("http")) {
                        recipeContent = `<a href="${item.レシピ}" target="_blank" rel="noopener noreferrer">レシピを見る</a>`;
                    } else {
                        recipeContent = item.レシピ;
                    }
                    const html = `
                        <div class="col mb-3">
                            <div class="card h-100">
                                <div class="card-body">
                                    <h5 class="card-title" data-nutrition="${item.nutrition || ''}">
                                        ${item.献立名}
                                    </h5>
                                    <p class="card-text">
                                        ${recipeContent}
                                    </p>
                                </div>
                            </div>
                        </div>
                    `;

                    if (item.献立カテゴリ === "メイン") {
                        sections.main += html;
                    } else if (item.献立カテゴリ === "サブ") {
                        sections.sub += html;
                    } else if (item.献立カテゴリ === "スープ") {
                        sections.soup += html;
                    }
                });

                $("#main .row").html(sections.main);
                $("#sub .row").html(sections.sub);
                $("#soup .row").html(sections.soup);
            });
        });
    </script>
