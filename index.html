    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous">
    </script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        $(function () {

            //
            // レシピの表示
            //
            $('#loading').css('display','flex');
            $.getJSON(
                "https://script.google.com/macros/s/AKfycbz7pdsW5sFZDHvMFmyhZz9dGrjCmrHP67oeggeCotaEbiuKfCfDa17aYy_QgfBg27kgng/exec"
            )
            .done(function (data) {
                const sections = { main: "", sub: "", soup: "" };

                data.forEach(function (item) {

                    let recipeContent;
                    if (item.レシピのURLかレシピを手入力してください && item.レシピのURLかレシピを手入力してください.startsWith("http")) {
                        recipeContent = `<a href="${item.レシピのURLかレシピを手入力してください}" target="_blank">レシピを見る</a>`;
                    } else {
                        recipeContent = item.レシピのURLかレシピを手入力してください;
                    }
                    const html = `
                        <div class="col mb-3">
                            <label class="card h-100" for="${item.タイムスタンプ}">
                                <div class="card-body">
                                    <div class="form-check fw-bold fs-5 mb-1">
                                        <input class="form-check-input" type="checkbox" value="${item.献立名を入力してください}" id="${item.タイムスタンプ}">
                                        <span class="form-check-label">
                                            ${item.献立名を入力してください}
                                        </span>
                                    </div>
                                    <p class="card-text">
                                        ${recipeContent}
                                    </p>
                                </div>
                            </div>
                        </div>
                    `;

                    if (item.献立のカテゴリを選択してください === "メイン") {
                        sections.main += html;
                    } else if (item.献立のカテゴリを選択してください === "サブ") {
                        sections.sub += html;
                    } else if (item.献立のカテゴリを選択してください === "スープ") {
                        sections.soup += html;
                    }
                });

                $("#main .row").html(sections.main);
                $("#sub .row").html(sections.sub);
                $("#soup .row").html(sections.soup);
            })
            .fail(function () {
                console.error("読み込みエラー");
            })
            .always(function () {
                // 読み込み完了時にスピナーを非表示
                $('#loading').hide();
            });

            //
            // 選択済の献立を表示する
            //
            $(document).on("change", ".form-check-input", function () {
                const $changedCheckbox = $(this);
                const recipe = $changedCheckbox.val();
                const changedCheckboxId = $changedCheckbox.attr("id");
                const $list = $("#selected-recipes");

                if ($changedCheckbox.is(":checked")) {
                    $list.append(`<li id="selected-${changedCheckboxId}">${recipe}</li>`);
                } else {
                    $(`[id="selected-${changedCheckboxId}"]`).remove();
                }

                // 選択済の献立があれば「選択済を見る」ボタンを有効化する
                if ($("#recipe-list .form-check-input:checked").length >= 1) {
                    $("#btn-selected-recipes").prop("disabled", false);
                } else {
                    $("#btn-selected-recipes").prop("disabled", true); 
                }
            });

            // ライン送信用のテキストの準備
            $("#btn-selected-recipes").on("click", function () {
                const recipes = $("#selected-recipes li").map(function () {
                    return $(this).text();
                }).get();

                // 改行で結合し、エンコード
                const message = "【献立】\n" + recipes.join("\n");
                const encodedMessage = encodeURIComponent(message);

                // LINEのリンクにセット
                $("#btn-line-share").attr("href", `https://line.me/R/msg/text/?${encodedMessage}`);
            });

            //
            // 献立スロット
            //
            let mainList = [], subList = [], soupList = [];

            $.getJSON(
                "https://script.google.com/macros/s/AKfycbz7pdsW5sFZDHvMFmyhZz9dGrjCmrHP67oeggeCotaEbiuKfCfDa17aYy_QgfBg27kgng/exec", function (data) {
                    data.forEach(item => {

                        switch (item.献立のカテゴリを選択してください) {
                            case "メイン":
                                mainList.push(item.献立名を入力してください);
                                break;
                            case "サブ":
                                subList.push(item.献立名を入力してください);
                                break;
                            case "スープ":
                                soupList.push(item.献立名を入力してください);
                                break;
                        }
                    });
                });

            $("#spin").on("click", function () {
                spinSlot("#main-slot", mainList);
                spinSlot("#sub-slot", subList);
                spinSlot("#soup-slot", soupList);
            });

            function spinSlot(slotSelector, list) {
                if (list.length === 0) return;

                let slot = $(slotSelector);
                let count = 20; // 回転回数
                let i = 0;

                let interval = setInterval(function () {
                    let randomItem = list[Math.floor(Math.random() * list.length)];
                    slot.text(randomItem);
                    i++;
                    if (i >= count) clearInterval(interval);
                }, 100); // スピード
            }
        });
    </script>
