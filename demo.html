<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<link href='http://fonts.googleapis.com/css?family=Telex' rel='stylesheet' type='text/css'>
<style type="text/css">
body {
	background: #efefef;
	padding: 80px;
}
p.step {
	font-family: 'Telex', sans-serif;
	}
.button {
	padding: 0;
	margin: 50px 10px;
}
/* ステップ1. HTMLを用意する */
/* ステップ2. ブロックを作る */
.button.step2 {
	position: relative;
	display: block;
	width: 100px;
	height: 100px;
  	border: 1px solid rgba(0,0,0,0.5);
}
/* ステップ3. 丸くなる */
.button.step3 {
	border-radius: 100px;
}
/* ステップ4. グラデーション */
.button.step4 {
	background: -moz-radial-gradient(50% 80%, circle, #00D1F2, #0055C1);
	background: -webkit-radial-gradient(50% 80%, circle, #00D1F2, #0055C1);
	}
/* ステップ5. 影をつける */
.button.step5 {
	box-shadow: 0 2px 6px rgba(0,0,0,0.5);
	}
/* ステップ6. グロー */
.button.step6 {
	box-shadow: 0 2px 6px rgba(0,0,0,0.5),
		0 2px 10px rgba(0,100,255, 0.7);
	}
/* ステップ7. ハイライト */
.button.step7 .glare {
	position: absolute;
	border-radius: 100px;
	width: 100%;
	height: 100%;
	background-image: -webkit-linear-gradient(top, rgba(250, 250, 255, 1) 0%, rgba(250, 250, 255, 0.7) 10%, rgba(250, 250, 255, 0) 100%);
	background-image: -moz-linear-gradient(top, rgba(250, 250, 255, 1) 0%, rgba(250, 250, 255, 0.7) 10%, rgba(250, 250, 255, 0) 100%);
	z-index: 3;
	top: -18px;
	-moz-transform: scale(0.8, 0.6); 
	-webkit-transform: scale(0.8, 0.6); 
}
/* ステップ8. 内側の影 */
.button.step8 {
	box-shadow: 0 2px 6px rgba(0,0,0,0.5),
		0 2px 10px rgba(0,100,255, 0.7),
		inset 0 0 10px rgba(0,0,150,0.6);
}

/* ステップ9. コースティクス */
.button.step9  {
	-webkit-box-reflect: 
		below -90px -webkit-gradient(linear, right top, left top, from(rgba(0,0,0,0.1)), to(rgba(0,0,0,0)));
}

/* ステップ10. テキストを追加する */
.button.step10 .text {
	display: block;
	color: rgba(255, 255, 255, 0.9);
	font-family: 'Telex', sans-serif;
	font-weight: 700;
	font-size: 15pt;
	text-shadow: 0px 0px 2px rgba(0, 0, 0, 0.5) ,
		0px 0px 4px rgba(255, 255, 255, 1);
	position: absolute;
	text-align: center;
	top: 40px;
	width: 100px;
	height: 100px;
	z-index: 1;
}

</style>
</head>
<body>
		<p class="step">Step2</p>
            <a class="step2 button">
<div class="glare"></div>

		</a>

		<p class="step">Step3</p>
            <a class="step2 step3 button">
<div class="glare"></div>

		</a>

		<p class="step">Step4</p>
            <a class="step2 step3 step4 button">
<div class="glare"></div>

		</a>

		<p class="step">Step5</p>
            <a class="step2 step3 step4 step5 button">
<div class="glare"></div>

		</a>

		<p class="step">Step6</p>
            <a class="step2 step3 step4 step5 step6 button">
<div class="glare"></div>

		</a>

		<p class="step">Step7</p>
            <a class="step2 step3 step4 step5 step6 step7 button">
<div class="glare"></div>

		</a>

		<p class="step">Step8</p>
            <a class="step2 step3 step4 step5 step6 step7 step8 button">
<div class="glare"></div>

		</a>

		<p class="step">Step9</p>
            <a class="step2 step3 step4 step5 step6 step7 step8 step9 button">
<div class="glare"></div>

		</a>

		<p class="step">Step10</p>
            <a class="step2 step3 step4 step5 step6 step7 step8 step9 step10 button">
		<span class="text">HOME</span>
<div class="glare"></div>

		</a>


</body>
</html>
